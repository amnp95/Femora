<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Interactive Femora figure</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="viewport" aria-label="Interactive three-dimensional figure">
    <div id="stage"></div>
  </div>
  <div id="toolbar">
    <span>Drag to rotate; scroll to zoom</span>
    <button id="reset" type="button">Reset view</button>
  </div>
  <p id="status" role="status">Loading 3D view...</p>
  <script type="module" src="viewer.js"></script>
</body>
</html>
