INHERIT: mkdocs.yml

# Local Concepts-only configuration. It intentionally skips generated API pages
# and their expensive mkdocstrings parsing while preserving the documentation UI.
plugins:
  - search
  - autorefs
  - section-index

nav:
  - Home: index.md
  - Installation: installation.md
  - 'Getting Started': getting_started.md
  - Concepts:
      - Overview: concepts/index.md
      - Model: concepts/model.md
      - Managers: concepts/managers.md
      - 'Building Blocks': concepts/building-blocks.md
      - 'Mesh Parts': concepts/mesh-parts.md
      - Interfaces: concepts/interfaces.md
      - Assembly: concepts/assembly.md
      - Partitioning: concepts/partitioning-and-parallel-execution.md
      - 'The Assembled Model': concepts/assembled-model.md
      - 'Tags and IDs': concepts/tags-and-ids.md
      - 'Regions and Groups': concepts/regions-and-groups.md
      - Damping: concepts/damping.md
      - Constraints: concepts/constraints.md
      - Loading: concepts/loading.md
      - 'Recorders and Actions': concepts/recorders-and-actions.md
      - Analysis: concepts/analysis.md
      - Process: concepts/process.md
      - 'Workflows and Remote Jobs': concepts/workflows.md
  - 'Tutorials & Examples':
      - Overview: tutorials-and-examples/index.md
      - Tutorials:
          - Gallery: tutorials/index.md
          - 'Elastic Cantilever': tutorials/elastic-cantilever.md
      - Examples:
          - Gallery: examples/index.md
          - 'Layered Elastic Soil Column': examples/layered-elastic-soil-column.md
          - 'Partitioned Layered Soil Domain': examples/partitioned-layered-soil-domain.md
          - 'Deconvolved Ricker-Wave Site Response': examples/deconvolved-ricker-site-response.md
          - 'Nonlinear Layered Soil Column': examples/nonlinear-layered-soil-column.md
          - 'Laterally Loaded Pile': examples/laterally-loaded-pile.md
          - 'Boundary Effects in Dynamic Pile-Soil Interaction': examples/dynamic-pile-soil-interaction.md
          - 'Two-Pile Bent Under DRM Excitation': examples/two-pile-bent-drm.md
          - 'Rotated Two-Pile Bent': examples/rotated-two-pile-bent.md
          - 'Foundation Contact and Separation': examples/embedded-block-contact.md
          - 'Elastic and Plastic Basin': examples/basin.md
  - 'Technical Reference':
      - 'Mesh Data Schema': technical-reference/mesh-data-schema.md
