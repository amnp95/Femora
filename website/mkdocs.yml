site_name: Femora
site_url: https://femora.io/docs/
repo_url: https://github.com/GeotechUW/Femora
repo_name: GeotechUW/Femora

theme:
  name: material
  logo: assets/femora-logo.svg
  favicon: assets/femora-logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.footer
    - content.code.copy
    - content.code.annotate
  palette:
    # System preference
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/link
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to system preference

# --- NEW: Math Support Configuration ---
markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      dedent_subsections: true
      base_path:
        - .
        - ..
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/example-gallery.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# --- END Math Config ---

extra_css:
  - stylesheets/workflows.css
  - stylesheets/extra.css

plugins:
  - search
  - autorefs
  - git-revision-date-localized:
      enable_creation_date: true
  - git-committers:
      repository: GeotechUW/Femora
      branch: main
      docs_path: website/docs/
  - gen-files:
      scripts:
        - gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
        default_handler: python
        handlers:
          python:
            paths: [../src]
            options:
              docstring_style: google
              docstring_section_style: table
              show_source: false
              show_category_heading: true
              separate_signature: true
              merge_init_into_class: true
              show_object_full_path: false
              members_order: source
              show_signature_annotations: true
              # This helps if the signature itself has the default values:
              show_root_full_path: false
              show_root_heading: true
              show_if_no_docstring: false 
              members: true
              filters: public

