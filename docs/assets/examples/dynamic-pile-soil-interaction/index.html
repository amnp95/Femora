<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dynamic pile-soil interaction preview</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: white; }
    body { display: flex; justify-content: center; }
    /* Isolate the first model panel; hide its timestamp and contour row. */
    .panel { position: relative; height: 100%; aspect-ratio: 1; overflow: hidden; }
    img { position: absolute; height: 212%; width: auto; top: -6%; left: 0; }
  </style>
</head>
<body>
  <div class="panel">
    <img src="boundary-comparison-preview.png" alt="Pile and head mass in two soil layers, with a quarter cut">
  </div>
</body>
</html>
