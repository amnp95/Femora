<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 570" role="img" aria-labelledby="regional-title regional-desc"><title id="regional-title">Regional SW4 problem and three local DRM sites</title><desc id="regional-desc">A three-dimensional cutaway shows the regional SW4 domain, shallow sedimentary basin, kinematic fault plane, and hypocenter at approximately eight kilometers depth. The domain is approximately 44 by 25 by 25 kilometers. The plan view below shows Sites 1 and 2 one kilometer fault-normal from the fault, separated by twenty kilometers along strike. Site 3 is seventeen kilometers farther fault-normal than Site 1, eighteen kilometers from the fault. Enlarged DRM boxes supply wave fields to local Femora models.</desc><defs><marker id="regional-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#657a82"/></marker></defs><style> .regional-text {font-family:sans-serif;fill:var(--md-default-fg-color,#293e45)} .regional-muted {fill:var(--md-default-fg-color--light,#536b70)} .regional-dimension {stroke:#657a82;stroke-width:1.3;fill:none;marker-start:url(#regional-arrow);marker-end:url(#regional-arrow)} .regional-guide {stroke:#657a82;stroke-dasharray:4 4;fill:none;opacity:.65} .regional-box {fill:#bb6449;fill-opacity:.14;stroke:#bb6449;stroke-width:2} </style><g class="regional-text"><text x="80" y="32" font-size="21" font-weight="600">Regional wave field / SW4</text><text x="80" y="55" font-size="14" class="regional-muted">Plan view</text><rect x="80" y="70" width="704" height="400" rx="3" fill="#cbbd84" fill-opacity=".2" stroke="#8b806b"/><rect x="80" y="430" width="704" height="40" fill="#8b929b" fill-opacity=".2"/><text x="477" y="108" font-size="17">Regional sedimentary basin</text><text x="104" y="456" font-size="15">Rock</text><path d="M185 430H702" stroke="#b34c46" stroke-width="5"/><text x="596" y="456" font-size="15">Fault trace</text><path class="regional-guide" d="M230 142V414H550"/><rect class="regional-box" x="223" y="407" width="14" height="14"/><circle cx="230" cy="414" r="3" fill="#bb6449"/><text x="251" y="409" font-size="17" font-weight="600">Site 1</text><rect class="regional-box" x="543" y="407" width="14" height="14"/><circle cx="550" cy="414" r="3" fill="#bb6449"/><text x="569" y="409" font-size="17" font-weight="600">Site 2</text><rect class="regional-box" x="223" y="135" width="14" height="14"/><circle cx="230" cy="142" r="3" fill="#bb6449"/><text x="251" y="148" font-size="17" font-weight="600">Site 3</text><path class="regional-dimension" d="M244 382H536"/><text x="390" y="370" text-anchor="middle" font-size="15">20 km along strike</text><path class="regional-dimension" d="M195 155V400"/><text x="179" y="278" text-anchor="middle" font-size="15" transform="rotate(-90 179 278)">17 km farther into the basin</text><path class="regional-dimension" d="M123 145V427"/><text x="106" y="286" text-anchor="middle" font-size="14" transform="rotate(-90 106 286)">Site 3: 18 km fault-normal</text><path d="M285 500H324V422" fill="none" stroke="#657a82" stroke-width="1.2"/><text x="80" y="507" font-size="14">Sites 1 and 2: 1 km fault-normal</text><text x="80" y="541" font-size="13" class="regional-muted">Relative site layout; DRM boxes enlarged for visibility.</text><path d="M793 280H840" stroke="#657a82" stroke-width="2" marker-end="url(#regional-arrow)"/><text x="805" y="259" font-size="13" text-anchor="middle">DRM</text><text x="860" y="174" font-size="18" font-weight="600">Local model / Femora</text><rect x="862" y="204" width="222" height="146" rx="3" fill="#60979d" fill-opacity=".12" stroke="#60979d" stroke-dasharray="5 4"/><rect x="885" y="224" width="176" height="104" fill="#b9ad91" fill-opacity=".3" stroke="#8b806b"/><path d="M907 224Q973 290 1039 224Z" fill="#bb6449" fill-opacity=".8" stroke="#91452e"/><text x="973" y="308" font-size="14" text-anchor="middle">Layered background</text><text x="973" y="378" font-size="14" text-anchor="middle">Additional local soft basin</text><text x="973" y="403" font-size="13" text-anchor="middle" class="regional-muted">128 x 128 x 48 m domain</text></g></svg>
